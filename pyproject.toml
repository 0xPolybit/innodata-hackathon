[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taskfactory"
version = "0.1.0"
description = "A free factory for chart and floor-plan questions with exact answers."
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pillow",
    "matplotlib",
    "opencv-python-headless",
    "pytesseract",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
tf = "taskfactory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
